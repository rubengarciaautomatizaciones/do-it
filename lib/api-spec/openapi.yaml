openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Do it - Productivity PWA API
servers:
  - url: /api
tags:
  - name: health
  - name: tasks
  - name: habits
  - name: transcribe
  - name: preferences
  - name: stripe
  - name: calendar
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tasks:
    get:
      operationId: getTasks
      tags: [tasks]
      parameters:
        - in: query
          name: completed
          schema:
            type: boolean
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/magic-text:
    post:
      operationId: createMagicTextTask
      tags: [tasks]
      summary: Procesa texto libre con Gemini para crear la tarea
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MagicTextInput"
      responses:
        "201":
          description: Task extracted and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /tasks/metadata:
    get:
      operationId: getTaskMetadata
      tags: [tasks]
      parameters:
        - in: query
          name: url
          required: true
          schema:
            type: string
      responses:
        "200":
          description: URL Metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UrlMetadata"

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /tasks/{id}/attachments:
    post:
      operationId: addTaskAttachment
      tags: [tasks]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddTaskAttachmentBody"
      responses:
        "201":
          description: Attachment linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskAttachment"

  /tasks/{taskId}/attachments/{attachmentId}:
    delete:
      operationId: deleteTaskAttachment
      tags: [tasks]
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
        - in: path
          name: attachmentId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Attachment deleted

  /tasks/stats:
    get:
      operationId: getTaskStats
      tags: [tasks]
      responses:
        "200":
          description: Task statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskStats"

  /habits:
    get:
      operationId: getHabits
      tags: [habits]
      responses:
        "200":
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HabitWithLogs"
    post:
      operationId: createHabit
      tags: [habits]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HabitInput"
      responses:
        "201":
          description: Created habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Habit"

  /habits/{id}:
    patch:
      operationId: updateHabit
      tags: [habits]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateHabitBody"
      responses:
        "200":
          description: Updated habit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitWithLogs"
    delete:
      operationId: deleteHabit
      tags: [habits]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /habits/{id}/log:
    post:
      operationId: logHabit
      tags: [habits]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogHabitBody"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HabitLog"
    delete:
      operationId: unlogHabit
      tags: [habits]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: date
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Removed

  /transcribe:
    post:
      operationId: transcribeAudio
      tags: [transcribe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranscribeInput"
      responses:
        "201":
          description: Task extracted and saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /preferences:
    get:
      operationId: getPreferences
      tags: [preferences]
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"
    patch:
      operationId: updatePreferences
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferenceUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreference"

  /stripe/checkout:
    post:
      operationId: createCheckout
      tags: [stripe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutBody"
      responses:
        "200":
          description: Checkout URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCheckoutResponse"

  /stripe/portal:
    post:
      operationId: createPortal
      tags: [stripe]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortalBody"
      responses:
        "200":
          description: Portal URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePortalResponse"

  /account:
    delete:
      operationId: deleteAccount
      tags: [preferences]
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Account deleted

  /support:
    post:
      operationId: createSupportTicket
      tags: [preferences]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email, motivo, mensaje]
              properties:
                userId: { type: string }
                email: { type: string }
                motivo: { type: string }
                mensaje: { type: string }
      responses:
        "201":
          description: Ticket created

  /calendar/events:
    get:
      operationId: getGoogleCalendarEvents
      tags: [calendar]
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Google Calendar Events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    title: { type: string }
                    start: { type: string }
                    end: { type: string }
                    allDay: { type: boolean }
                    isGoogleCalendar: { type: boolean }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    UrlMetadata:
      type: object
      required: [url]
      properties:
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        image: { type: ["string", "null"] }
        url: { type: string }

    TaskAttachment:
      type: object
      required: [id, taskId, fileName, fileUrl, fileType, createdAt]
      properties:
        id: { type: string }
        taskId: { type: string }
        fileName: { type: string }
        fileUrl: { type: string }
        fileType: { type: string }
        createdAt: { type: string }

    AddTaskAttachmentBody:
      type: object
      required: [fileName, fileUrl, fileType]
      properties:
        fileName: { type: string }
        fileUrl: { type: string }
        fileType: { type: string }

    Task:
      type: object
      required: [id, userId, titulo, completada, createdAt, updatedAt, attachments]
      properties:
        id: { type: string }
        userId: { type: string }
        titulo: { type: string }
        descripcion: { type: ["string", "null"] }
        fechaVencimiento: { type: ["string", "null"] }
        fechaFin: { type: ["string", "null"] }
        horaInicio: { type: ["string", "null"] }
        horaVencimiento: { type: ["string", "null"] }
        fechaNotificacion: { type: ["string", "null"] }
        horaNotificacion: { type: ["string", "null"] }
        proyecto: { type: ["string", "null"] }
        orden: { type: ["integer", "null"] }
        links: { type: array, items: { type: string } }
        notificaciones: { type: array, items: { type: string } }
        completada: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
        attachments: 
          type: array
          items:
            $ref: "#/components/schemas/TaskAttachment"

    TaskInput:
      type: object
      required: [titulo, userId]
      properties:
        titulo: { type: string, minLength: 1 }
        descripcion: { type: ["string", "null"] }
        fechaVencimiento: { type: ["string", "null"] }
        fechaFin: { type: ["string", "null"] }
        horaInicio: { type: ["string", "null"] }
        horaVencimiento: { type: ["string", "null"] }
        fechaNotificacion: { type: ["string", "null"] }
        horaNotificacion: { type: ["string", "null"] }
        proyecto: { type: ["string", "null"] }
        orden: { type: ["integer", "null"] }
        links: { type: array, items: { type: string } }
        notificaciones: { type: array, items: { type: string } }
        userId: { type: string }

    MagicTextInput:
      type: object
      required: [text, userId]
      properties:
        text: { type: string, minLength: 1 }
        userId: { type: string }

    TaskUpdate:
      type: object
      properties:
        titulo: { type: string }
        descripcion: { type: ["string", "null"] }
        fechaVencimiento: { type: ["string", "null"] }
        fechaFin: { type: ["string", "null"] }
        horaInicio: { type: ["string", "null"] }
        horaVencimiento: { type: ["string", "null"] }
        fechaNotificacion: { type: ["string", "null"] }
        horaNotificacion: { type: ["string", "null"] }
        proyecto: { type: ["string", "null"] }
        orden: { type: ["integer", "null"] }
        links: { type: array, items: { type: string } }
        notificaciones: { type: array, items: { type: string } }
        completada: { type: boolean }

    TaskStats:
      type: object
      required: [total, completed, pending, completedToday]
      properties:
        total: { type: integer }
        completed: { type: integer }
        pending: { type: integer }
        completedToday: { type: integer }

    Habit:
      type: object
      required: [id, userId, nombre, tipoMeta, metaNumero, frecuenciaTipo, frecuenciaValor, fechaInicio, estado, currentStreak, bestStreak, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        nombre: { type: string }
        tipoMeta: { type: string }
        metaNumero: { type: integer }
        unidad: { type: ["string", "null"] }
        frecuenciaTipo: { type: string }
        frecuenciaValor: { type: array, items: { type: number } }
        recordatorioHora: { type: ["string", "null"] }
        fechaInicio: { type: string }
        fechaFin: { type: ["string", "null"] }
        estado: { type: string }
        qstashMessageId: { type: ["string", "null"] }
        currentStreak: { type: integer }
        bestStreak: { type: integer }
        createdAt: { type: string }

    HabitLogItem:
      type: object
      required: [fecha, valor]
      properties:
        fecha: { type: string }
        valor: { type: integer }

    HabitWithLogs:
      type: object
      required: [id, userId, nombre, tipoMeta, metaNumero, frecuenciaTipo, frecuenciaValor, fechaInicio, estado, currentStreak, bestStreak, createdAt, logs]
      properties:
        id: { type: string }
        userId: { type: string }
        nombre: { type: string }
        tipoMeta: { type: string }
        metaNumero: { type: integer }
        unidad: { type: ["string", "null"] }
        frecuenciaTipo: { type: string }
        frecuenciaValor: { type: array, items: { type: number } }
        recordatorioHora: { type: ["string", "null"] }
        fechaInicio: { type: string }
        fechaFin: { type: ["string", "null"] }
        estado: { type: string }
        qstashMessageId: { type: ["string", "null"] }
        currentStreak: { type: integer }
        bestStreak: { type: integer }
        createdAt: { type: string }
        logs: { type: array, items: { $ref: "#/components/schemas/HabitLogItem" } }

    HabitInput:
      type: object
      required: [nombre, userId, fechaInicio]
      properties:
        nombre: { type: string, minLength: 1 }
        tipoMeta: { type: string }
        metaNumero: { type: integer }
        unidad: { type: ["string", "null"] }
        frecuenciaTipo: { type: string }
        frecuenciaValor: { type: array, items: { type: number } }
        recordatorioHora: { type: ["string", "null"] }
        fechaInicio: { type: string }
        fechaFin: { type: ["string", "null"] }
        userId: { type: string }

    UpdateHabitBody:
      type: object
      properties:
        nombre: { type: string }
        tipoMeta: { type: string }
        metaNumero: { type: integer }
        unidad: { type: ["string", "null"] }
        frecuenciaTipo: { type: string }
        frecuenciaValor: { type: array, items: { type: number } }
        recordatorioHora: { type: ["string", "null"] }
        fechaInicio: { type: string }
        fechaFin: { type: ["string", "null"] }
        estado: { type: string }

    LogHabitBody:
      type: object
      required: [valor]
      properties:
        valor: { type: integer }

    HabitLog:
      type: object
      required: [id, habitId, fechaCompletado, valor]
      properties:
        id: { type: string }
        habitId: { type: string }
        fechaCompletado: { type: string }
        valor: { type: integer }

    TranscribeInput:
      type: object
      required: [userId, audioBase64, mimeType]
      properties:
        userId: { type: string }
        audioBase64: { type: string }
        mimeType: { type: string }

    UserPreference:
      type: object
      required: [id, userId, idioma, inicioSemana, hasSeenTutorial]
      properties:
        id: { type: string }
        userId: { type: string }
        idioma: { type: string }
        inicioSemana: { type: string }
        hasSeenTutorial: { type: boolean }

    UserPreferenceUpdate:
      type: object
      properties:
        idioma: { type: string }
        inicioSemana: { type: string }
        hasSeenTutorial: { type: boolean }

    CreateCheckoutBody:
      type: object
      required: [priceId, userId]
      properties:
        priceId: { type: string }
        userId: { type: string }

    CreateCheckoutResponse:
      type: object
      properties:
        url: { type: string }

    CreatePortalBody:
      type: object
      required: [userId]
      properties:
        userId: { type: string }

    CreatePortalResponse:
      type: object
      properties:
        url: { type: string }